<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOW Into LIXIL — Training Matrix</title>
<style>
  :root {
    --dark-blue: #1F3864;
    --med-blue:  #2E75B6;
    --g1-blue:   #4472C4;
    --g2-teal:   #1F6B75;
    --green:     #70AD47;
    --red:       #D9342B;
    --light-bg:  #D6E4F0;
    --gray-hdr:  #404040;
    --border:    #BFBFBF;
    --white:     #ffffff;
    --body-bg:   #f4f7fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: var(--body-bg); color: #222; font-size: 13px; }

  /* ── Top bar ── */
  .topbar {
    background: var(--dark-blue);
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .topbar h1 { font-size: 16px; font-weight: 700; letter-spacing: .5px; }
  .topbar .updated { font-size: 11px; opacity: .75; }

  /* ── Summary cards ── */
  .summary-row {
    display: flex;
    gap: 12px;
    padding: 16px 24px 8px;
    flex-wrap: wrap;
  }
  .card {
    background: white;
    border-radius: 8px;
    padding: 12px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
    min-width: 130px;
    text-align: center;
  }
  .card .num { font-size: 26px; font-weight: 700; color: var(--med-blue); }
  .card .lbl { font-size: 11px; color: #666; margin-top: 2px; }

  /* ── Filters ── */
  .filters {
    display: flex;
    gap: 10px;
    padding: 8px 24px 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filters label { font-size: 12px; color: #555; }
  .filters select, .filters input {
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 12px;
    background: white;
    cursor: pointer;
  }
  .filters input { width: 180px; }
  .btn-reset {
    background: var(--med-blue);
    color: white;
    border: none;
    border-radius: 5px;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-reset:hover { background: var(--dark-blue); }

  /* ── Legend ── */
  .legend {
    display: flex;
    gap: 18px;
    padding: 0 24px 10px;
    align-items: center;
    font-size: 12px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 16px; height: 16px; border-radius: 3px; display: inline-block; }
  .dot-green { background: var(--green); }
  .dot-red { background: var(--red); }
  .dot-g1 { background: var(--g1-blue); }
  .dot-g2 { background: var(--g2-teal); }

  /* ── Table wrapper ── */
  .table-wrap {
    overflow-x: auto;
    padding: 0 24px 32px;
  }

  table {
    border-collapse: collapse;
    white-space: nowrap;
    background: white;
    box-shadow: 0 1px 6px rgba(0,0,0,.1);
    border-radius: 6px;
    overflow: hidden;
    min-width: 100%;
  }
  th, td {
    border: 1px solid var(--border);
    text-align: center;
    padding: 0;
  }

  /* ── Sticky first two cols ── */
  .col-name {
    position: sticky;
    left: 0;
    z-index: 3;
    min-width: 180px;
    max-width: 200px;
    text-align: left !important;
    padding: 0 8px !important;
  }
  .col-grp {
    position: sticky;
    left: 180px;
    z-index: 3;
    width: 38px;
    min-width: 38px;
  }
  /* when scrolled, add a shadow to the sticky cols */
  .col-name, .col-grp { box-shadow: 2px 0 4px rgba(0,0,0,.06); }

  /* ── Header rows ── */
  .row-title th {
    background: var(--dark-blue);
    color: white;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 8px;
    text-align: left;
  }

  .row-week th {
    background: var(--med-blue);
    color: white;
    font-size: 10px;
    font-weight: 700;
    height: 20px;
    line-height: 20px;
  }

  .row-training th {
    background: var(--med-blue);
    color: white;
    font-size: 9.5px;
    font-weight: 700;
    height: 140px;
    vertical-align: bottom;
    padding: 4px 2px;
    width: 32px;
    min-width: 32px;
  }
  .rot { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; line-height: 1.2; }

  .row-g1 th {
    background: var(--g1-blue);
    color: white;
    font-size: 9px;
    height: 18px;
    line-height: 18px;
  }
  .row-g2 th {
    background: var(--g2-teal);
    color: white;
    font-size: 9px;
    height: 18px;
    line-height: 18px;
  }

  /* ── Agency header rows ── */
  .row-agency td {
    background: var(--gray-hdr);
    color: white;
    font-weight: 700;
    font-size: 11px;
    text-align: left;
    padding: 5px 8px;
    height: 24px;
  }

  /* ── Data rows ── */
  .row-data td {
    height: 22px;
    font-size: 12px;
  }
  .row-data.alt td { background: var(--light-bg); }
  .row-data:not(.alt) td { background: white; }

  /* override sticky cols for agency/data */
  .row-agency .col-name { background: var(--gray-hdr) !important; }
  .row-agency .col-grp  { background: var(--gray-hdr) !important; }
  .row-data.alt .col-name, .row-data.alt .col-grp { background: var(--light-bg) !important; }
  .row-data:not(.alt) .col-name, .row-data:not(.alt) .col-grp { background: white !important; }

  /* override sticky header cols */
  .row-title .col-name, .row-title .col-grp { background: var(--dark-blue) !important; }
  .row-week  .col-name, .row-week  .col-grp { background: var(--dark-blue) !important; }
  .row-training .col-name { background: var(--dark-blue) !important; font-size: 11px; }
  .row-training .col-grp  { background: var(--dark-blue) !important; }
  .row-g1 .col-name, .row-g1 .col-grp { background: var(--g1-blue) !important; text-align: left; padding-left: 8px !important; font-size: 10px; }
  .row-g2 .col-name, .row-g2 .col-grp { background: var(--g2-teal) !important; text-align: left; padding-left: 8px !important; font-size: 10px; }

  .cell-check { background: var(--green) !important; color: white; font-weight: 700; font-size: 13px; }
  .cell-miss  { background: var(--red)   !important; color: white; font-weight: 700; font-size: 13px; }

  .tag-g1 { background: var(--g1-blue); color: white; font-size: 9px; font-weight: 700; border-radius: 3px; padding: 1px 3px; }
  .tag-g2 { background: var(--g2-teal); color: white; font-size: 9px; font-weight: 700; border-radius: 3px; padding: 1px 3px; }

  /* pct bar */
  .pct-bar { width: 100%; height: 6px; background: #eee; border-radius: 3px; margin-top: 2px; }
  .pct-fill { height: 6px; border-radius: 3px; background: var(--green); }

  /* hidden rows */
  tr.hidden { display: none; }

  /* ── Agency sidebar card (hover tooltip) ── */
  .agency-stat { font-size: 10px; color: #aaa; margin-left: 8px; }

  @media print {
    .filters, .topbar .updated { display: none; }
    .table-wrap { padding: 0; }
  }
</style>
</head>

// ── Build summary cards ────────────────────────────────────────────────────
function buildCards() {
  const totalPeople = ROWS.length;
  const totalSessions = TRAININGS.length * totalPeople;
  const attended = ROWS.reduce((s, r) => s + r.attended.length, 0);
  const overallPct = Math.round(attended / totalSessions * 100);
  const g1 = ROWS.filter(r => r.group === 1).length;
  const g2 = ROWS.filter(r => r.group === 2).length;

  const html = `
    <div class="card"><div class="num">${totalPeople}</div><div class="lbl">Participants</div></div>
    <div class="card"><div class="num">${AGENCIES.length}</div><div class="lbl">Agencies</div></div>
    <div class="card"><div class="num">${TRAININGS.length}</div><div class="lbl">Trainings</div></div>
    <div class="card"><div class="num" style="color:var(--g1-blue)">${g1}</div><div class="lbl">Group 1</div></div>
    <div class="card"><div class="num" style="color:var(--g2-teal)">${g2}</div><div class="lbl">Group 2</div></div>
    <div class="card"><div class="num" style="color:var(--green)">${overallPct}%</div><div class="lbl">Overall Completion</div></div>
  `;
  document.getElementById('summaryCards').innerHTML = html;
}

// ── Build table header ─────────────────────────────────────────────────────
function buildHead() {
  const head = document.getElementById('tableHead');

  // Row 1: title
  let r1 = '<tr class="row-title"><th class="col-name" colspan="1">Participant</th><th class="col-grp">Grp</th>';
  r1 += `<th colspan="${TRAININGS.length}" style="text-align:left;padding:10px 8px;">Training Sessions</th></tr>`;

  // Row 2: week bands
  let r2 = '<tr class="row-week"><th class="col-name"></th><th class="col-grp"></th>';
  for (const [label, span] of WEEK_SPANS) {
    r2 += `<th colspan="${span}">${label}</th>`;
  }
  r2 += '</tr>';

  // Row 3: training names
  let r3 = '<tr class="row-training"><th class="col-name" style="font-size:11px;vertical-align:middle;">Participant</th><th class="col-grp"></th>';
  for (const t of TRAININGS) {
    r3 += `<th><span class="rot">${t}</span></th>`;
  }
  r3 += '</tr>';

  // Row 4: G1 dates
  let r4 = '<tr class="row-g1"><th class="col-name">G1 Date (Feb start)</th><th class="col-grp">G1</th>';
  for (const t of TRAININGS) {
    r4 += `<th>${G1_DATES[t] || ''}</th>`;
  }
  r4 += '</tr>';

  // Row 5: G2 dates
  let r5 = '<tr class="row-g2"><th class="col-name">G2 Date (Mar start)</th><th class="col-grp">G2</th>';
  for (const t of TRAININGS) {
    r5 += `<th>${G2_DATES[t] || ''}</th>`;
  }
  r5 += '</tr>';

  head.innerHTML = r1 + r2 + r3 + r4 + r5;
}

// ── Build table body ───────────────────────────────────────────────────────
function buildBody(filteredRows) {
  const body = document.getElementById('tableBody');
  let html = '';
  let lastAgency = null;
  let alt = false;

  for (const row of filteredRows) {
    if (row.agency !== lastAgency) {
      const s = SUMMARY[row.agency];
      const agencyPct = s ? s.pct : 0;
      html += `<tr class="row-agency" data-agency="${row.agency}">
        <td class="col-name" colspan="1">${row.agency.toUpperCase()}
          <span class="agency-stat">${s ? s.count + ' people · ' + agencyPct + '% complete' : ''}</span>
        </td>
        <td class="col-grp"></td>
        ${TRAININGS.map(() => '<td></td>').join('')}
      </tr>`;
      lastAgency = row.agency;
      alt = false;
    }

    const tag = row.group === 1
      ? '<span class="tag-g1">G1</span>'
      : '<span class="tag-g2">G2</span>';

    const altClass = alt ? ' alt' : '';
    html += `<tr class="row-data${altClass}" data-agency="${row.agency}" data-group="${row.group}" data-name="${row.name.toLowerCase()}">
      <td class="col-name" style="padding:0 8px">${row.name}</td>
      <td class="col-grp">${tag}</td>`;

    for (const t of TRAININGS) {
      if (row.attended.includes(t)) {
        html += '<td class="cell-check">✓</td>';
      } else {
        html += '<td class="cell-miss">✗</td>';
      }
    }
    html += '</tr>';
    alt = !alt;
  }

  body.innerHTML = html;
}

// ── Filters ────────────────────────────────────────────────────────────────
function populateAgencyFilter() {
  const sel = document.getElementById('filterAgency');
  for (const a of AGENCIES) {
    const opt = document.createElement('option');
    opt.value = a;
    opt.textContent = a;
    sel.appendChild(opt);
  }
}

function applyFilters() {
  const agency = document.getElementById('filterAgency').value;
  const group  = document.getElementById('filterGroup').value;
  const name   = document.getElementById('filterName').value.toLowerCase().trim();

  const filtered = ROWS.filter(r => {
    if (agency && r.agency !== agency) return false;
    if (group  && r.group  !== parseInt(group)) return false;
    if (name   && !r.name.toLowerCase().includes(name)) return false;
    return true;
  });

  buildBody(filtered);
}

function resetFilters() {
  document.getElementById('filterAgency').value = '';
  document.getElementById('filterGroup').value  = '';
  document.getElementById('filterName').value   = '';
  buildBody(ROWS);
}

// ── Init ──────────────────────────────────────────────────────────────────
buildCards();
buildHead();
populateAgencyFilter();
buildBody(ROWS);
</script>
